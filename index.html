<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>VKU Field Survey — Offline Data Collection</title>
    
    <!-- Canonical domain redirection: Always direct users to the official optimized production domain -->
    <script>
      (function() {
        var h = window.location.hostname;
        if (h.endsWith('.miniproject--field-survey.pages.dev') && h !== 'miniproject--field-survey.pages.dev') {
          window.location.replace('https://miniproject--field-survey.pages.dev' + window.location.pathname + window.location.search);
        }
      })();
    </script>

    <!-- PWA & Theme Configuration -->
    <meta name="theme-color" content="#0284c7" />
    <meta name="description" content="Offline-first PWA for campus facility inspections & mobile surveys at VKU" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    
    <!-- iOS PWA meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VKU Survey" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service Worker registration with automatic cache purge & update management
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              // Automatically check for new updates on every page visit
              registration.update();
              
              // Register Background Sync if supported
              if ('SyncManager' in window) {
                registration.sync.register('sync-surveys').catch(() => {});
              }
            })
            .catch((err) => {
              console.warn('[PWA] ServiceWorker registration warning:', err);
            });

          // If a newly activated Service Worker takes over, refresh once to apply clean cache
          let isRefreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!isRefreshing) {
              isRefreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
</html>
